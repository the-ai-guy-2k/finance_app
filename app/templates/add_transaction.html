{% extends 'base.html' %}
{% block content %}
<h2>Add Transaction</h2>

<section>
  <h3>Enter Transaction Details</h3>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="merchant">Merchant/Store Name:</label>
      <input type="text" id="merchant" name="merchant" required>
    </div>

    <div>
      <label for="amount">Amount ($):</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0" required>
    </div>

    <div>
      <label for="category">Category:</label>
      <input type="text" id="category" name="category" placeholder="e.g., groceries, fuel, entertainment">
      <small>Suggested: groceries, food, fuel, healthcare, entertainment, utilities, other</small>
    </div>

    <div>
      <label for="date">Date (YYYY-MM-DD):</label>
      <input type="date" id="date" name="date">
      <small>Leave blank for today's date</small>
    </div>

    <div>
      <label for="note">Note:</label>
      <textarea id="note" name="note" placeholder="Optional notes about this transaction"></textarea>
      <small>Maximum 500 characters</small>
    </div>

    <button type="submit">Add Transaction</button>
  </form>
</section>
{% endblock %}
