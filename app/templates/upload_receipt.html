{% extends 'base.html' %}
{% block content %}
<h2>Upload Receipt</h2>

<section>
  <h3>Parse Receipt Image</h3>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="receipt">Select receipt image:</label>
      <input type="file" id="receipt" name="receipt" accept="image/*" required>
      <small>Supported formats: PNG, JPG, JPEG, WebP (maximum 10MB)</small>
    </div>
    <button type="submit">Upload Receipt</button>
  </form>
  <p style="color: #718096; margin-top: 1rem; font-size: 0.9rem;">
    ℹ️ Your receipt image will be analyzed to extract merchant, amount, date, and category information.
  </p>
</section>
{% endblock %}
