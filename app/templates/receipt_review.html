{% extends 'base.html' %}
{% block content %}
<h2>Review Receipt</h2>

<section>
  <p>Confidence was <strong>{{ header.confidence }}</strong>. Confirm or edit fields before saving.</p>
  {% if image_url %}
    <p><img src="{{ image_url }}" alt="Receipt image" style="max-width: 320px; border: 1px solid #ddd6fe; border-radius: 8px;"></p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <h3>Receipt Details</h3>
    <div>
      <label for="merchant">Merchant</label>
      <input type="text" id="merchant" name="merchant" value="{{ header.merchant }}" required>
    </div>
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="{{ header.date[:10] if header.date and header.date|length >= 10 else '' }}">
    </div>
    <div>
      <label for="subtotal">Subtotal</label>
      <input type="text" id="subtotal" name="subtotal" value="{{ header.subtotal }}">
    </div>
    <div>
      <label for="tax">Tax</label>
      <input type="text" id="tax" name="tax" value="{{ header.tax }}">
    </div>
    <div>
      <label for="tip">Tip</label>
      <input type="text" id="tip" name="tip" value="{{ header.tip }}">
    </div>
    <div>
      <label for="total">Total</label>
      <input type="text" id="total" name="total" value="{{ header.total }}" required>
    </div>
    <div>
      <label for="payment_method">Payment method</label>
      <select id="payment_method" name="payment_method">
        {% for method in payment_methods %}
          <option value="{{ method }}" {% if header.payment_method == method %}selected{% endif %}>{{ method }}</option>
        {% endfor %}
      </select>
    </div>

    <h3>Line Items</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Line total</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody>
        {% for item in line_items %}
          <tr>
            <td>
              <input type="hidden" name="line_id" value="{{ item.line_id }}">
              <input type="text" name="line_name" value="{{ item.name }}" required>
            </td>
            <td><input type="text" name="line_total" value="{{ item.line_total }}" required></td>
            <td>
              <select name="line_category">
                {% for slug, label in categories %}
                  <option value="{{ slug }}" {% if item.category == slug %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <div style="margin-top: 1rem;">
      <button type="submit" name="action" value="confirm">Confirm &amp; Save</button>
      <button type="submit" name="action" value="discard" class="danger-button">Discard</button>
      <a href="{{ url_for('main.dashboard') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
