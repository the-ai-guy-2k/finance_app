name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate syntax
        run: |
          python -m py_compile app.py
          python -m py_compile app/__init__.py
          python -m py_compile app/routes/main.py
          python -m py_compile app/services/openai_service.py
          python -m py_compile app/utils/storage.py
          python -m py_compile app/utils/normalize.py
          python -m py_compile app/utils/config_manager.py
          python -m py_compile app/utils/preflight.py
          python -m py_compile app/utils/openai_key.py
          python -m py_compile app/utils/logging_service.py
          python -m py_compile gunicorn.conf.py

      - name: Import check
        run: |
          python -c "import app; print('app import ok')"
          python -c "from app.utils import config, preflight; print('utils import ok')"
          python -c "from app.services import OpenAIService; print('services import ok')"

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-ci-test-placeholder
        run: pytest tests/ -v

      - name: Validate Docker build
        run: docker build -t finance_app_for_aws:ci-test .

      # Docker Hub publish is handled by .github/workflows/docker-publish.yml
      # on push to deployable and manual workflow_dispatch only.
